    timeout: 120

  - id: "llama3_1_8b_vllm"
    backend: "vllm"
    model_name: "meta-llama/Llama-3.1-8B-Instruct"
    enabled: false
    timeout: 120

  - id: "gemma2_9b_vllm"
    backend: "vllm"
    model_name: "google/gemma-2-9b-it"
    enabled: false
    timeout: 120

